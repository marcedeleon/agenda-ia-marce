services:
  postgres:
    image: postgres:16-alpine
    container_name: agenda_ia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: agenda
      POSTGRES_DB: agenda_ia
    ports:
      - '5432:5432'
    volumes:
      - agenda_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agenda -d agenda_ia']
      interval: 5s
      timeout: 5s
      retries: 10

  # PostgreSQL efímero para tests de integración (opcional).
  postgres_test:
    image: postgres:16-alpine
    container_name: agenda_ia_postgres_test
    restart: 'no'
    environment:
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: agenda
      POSTGRES_DB: agenda_ia_test
    ports:
      - '5433:5432'

volumes:
  agenda_pg_data:
